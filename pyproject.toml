[project]
name = "cvae"
version = "0.1.0"
description = "Conditional Variational Auto Encoder model built in PyTorch "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.5.0",
]

[project.optional-dependencies]
cpu = [
    "torch==2.11.0+cpu",
    "torchvision==0.26.0+cpu",
    "lightning>=2.6.5",
    "transformers>=5.12.1",
]
cu126 = [
    "torch==2.11.0+cu126",
    "torchvision==0.26.0+cu126",
    "lightning>=2.6.5",
    "transformers>=5.12.1",
]
cu128 = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "lightning>=2.6.5",
    "transformers>=5.12.1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-cu126", extra = "cu126" },
    { index = "torch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-cu126", extra = "cu126" },
    { index = "torch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
